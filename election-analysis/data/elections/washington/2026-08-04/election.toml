forecast_reliability = 75
forecast_basis = "Official King County 45% turnout forecast times 1,454,559 voters."

[[sources]]
id = "washington"
path = "input/washington"
jurisdiction = "Washington State"
scope = "state"
priority = 100
certification_date = 2026-08-21
expected_final_ballots = 2061930
forecast_reliability = 45
forecast_basis = "Official 2022 statewide primary turnout of 40.43% times about 5.1 million current voters."

# Only this immutable snapshot/contest is annotated. Other legacy versions stay
# unknown, including old county snapshots. Source: the official primary page's
# completed-recount table (initial and recount: Shepard 13,125; Collins 13,121).
[[result_status]]
source_id = "washington"
snapshot_sha256 = "bdd7591803dc9ff69614d09a342ff27be3faa2281b4757e8034a0c1503edf3c1"
contest_id = "169896"
lifecycle = "recount_completed"
tabulation_stage = "plurality_count"
# The source remains the published count summary. The separate authority confirms
# recount completion; this annotation does not turn the summary into a recount file.
result_version = "wa-2026-primary-summary-20260911"
authority_url = "https://www.sos.wa.gov/elections/data-research/election-data-and-maps/election-results-and-voters-pamphlets/2026-primary-election"
evidence_as_of = 2026-10-25T04:27:06Z

