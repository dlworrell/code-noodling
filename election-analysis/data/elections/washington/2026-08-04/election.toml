schema_version = 2

[election]
title = "2026 Washington Primary Historical Results — EA-01 Audit Correction"
report_mode = "historical"
forecast_target = "none"
information_time = 2026-10-25T04:27:06Z

# EA-01 (#46): authority evidence, not the scheduled certification deadline.
# This is the evidence observation time, not a backdated forecast input.
[election.status]
lifecycle = "certified"
authority_url = "https://www.sos.wa.gov/about-office/news/2026/secretary-state-certifies-candidates-and-measures-november-general-election"
evidence_as_of = 2026-10-25T04:27:06Z

[analysis]
write_in_labels = ["write-in", "write in"]

[[sources]]
id = "king-county"
path = "input/king-county"
jurisdiction = "King County, Washington"
