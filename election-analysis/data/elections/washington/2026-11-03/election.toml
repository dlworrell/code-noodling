# Generated by `python -m election_reporting.watch plan` from
# election-analysis/data/watch.toml. Safe to edit: later runs only append sources
# for newly selected places.
schema_version = 2

[election]
title = "2026 General (November 3, 2026)"


# Election status (ADR-003). Evidence: every results.votewa.gov capture retrieved at
# 2026-11-05T21:14:40Z reports "isOfficialResults": false, i.e. unofficial results
# while counting continues. Update to "certified" (with the certification notice)
# after the Secretary of State certifies (scheduled 2026-12-03).
[election.status]
lifecycle = "counting"
authority_url = "https://results.votewa.gov/results/public/washington"
evidence_as_of = 2026-11-05T21:14:40Z

[analysis]
write_in_labels = ["write-in", "write in"]
# General election: the top vote-getter wins (the top-two rule is for primaries).
default_rule = "winner"

