name: Verified reviewed change (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-change-election
  cancel-in-progress: false
jobs:
  publish-reviewed-change:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'dlworrell'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish exact reviewed tree and verify GitHub signature
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PAYLOAD_SHA256: 1f6180705b7e216c160f30d2829af141adf774296512706032cecbd0135e80e1
        run: python3 .github/signing-repair/publish.py
