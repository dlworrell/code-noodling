name: Verified signing repair (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signing-repair-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verified-repair:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'dlworrell'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish exact reviewed tree with GitHub signing and verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PAYLOAD_SHA256: c7482ae61008c4341c8808c36c3679cb1ecc063be70d80a1d6aac60d9312792c
        run: python3 .github/signing-repair/publish.py
