name: Public runner policy
on:
  push:
    branches: [main, dev-daily, fitment]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python scripts/ci/check_public_runners.py
      - run: python -m unittest discover -s tests/ci -p 'test_public_runners.py'
