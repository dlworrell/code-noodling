name: Election Result Reports

# ADR-0006 (AES-DEV-001-R003/R005): this workflow never pushes to the default
# branch. When regenerated reports differ from what is committed, the
# publish-pull-request job writes a GitHub-verified commit (GraphQL
# createCommitOnBranch) to the workflow-owned automation/election-reports branch
# and opens or updates a pull request to the default branch.
# Never add pull_request_target: the publish job holds a write token.

on:
  workflow_dispatch:
    inputs:
      commit_reports:
        description: Open or update a pull request with regenerated reports (default branch only)
        required: true
        type: boolean
        default: true
  push:
    paths:
      # Generated reports are excluded so the automation commit does not
      # retrigger this workflow.
      - "election/**"
      - "!election/reports/**"
      - ".github/workflows/election-result-reports.yml"
  pull_request:
    paths:
      - "election/**"
      - ".github/workflows/election-result-reports.yml"
      - ".github/workflows/election-source-watch.yml"

permissions:
  contents: read

concurrency:
  group: election-result-reports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      reports_changed: ${{ steps.report_diff.outputs.changed }}
    steps:
      - name: Check out Code Noodling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned EDT
        uses: actions/checkout@v4
        with:
          repository: dlworrell/engineering-docs-toolkit
          ref: 649981ec78c97aafe4374284ad7e8c57c11a4640
          path: .tools/engineering-docs-toolkit
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test election reporting
        env:
          PYTHONPATH: election:.tools/engineering-docs-toolkit
        run: python -m unittest discover -s election/tests -p 'test_election_reporting.py' -v

      - name: Test report publisher
        env:
          PYTHONPATH: election
        run: python -m unittest discover -s election/tests -p 'test_publish_reports.py' -v

      - name: Test election source watcher
        env:
          PYTHONPATH: election
        run: python -m unittest discover -s election/tests -p 'test_election_watch*.py' -v

      - name: Test Alaska precinct crosswalk
        env:
          PYTHONPATH: election
        run: python -m unittest discover -s election/tests -p 'test_alaska_crosswalk.py' -v

      - name: Test county and precinct breakdowns
        env:
          PYTHONPATH: election
        run: python -m unittest discover -s election/tests -p 'test_election_areas.py' -v

      - name: Generate and validate EDT reports
        env:
          PYTHONPATH: election:.tools/engineering-docs-toolkit
        shell: bash
        run: |
          # One report directory per state and election:
          # election/data/elections/<state>/<date>/ builds into
          # election/reports/<state>/<date>/. An election without any snapshots
          # yet (the watcher created only its election.toml) is skipped.
          set -euo pipefail
          shopt -s nullglob
          built=0
          for config in election/data/elections/*/*/election.toml; do
            directory="$(dirname "$config")"
            election="$(basename "$(dirname "$directory")")/$(basename "$directory")"
            if ! compgen -G "$directory/input/*/*" > /dev/null; then
              echo "Skipping $election: no snapshots yet."
              continue
            fi
            python -m election_reporting --config "$config" --output "election/reports/$election"
            built=$((built + 1))
          done
          if [ "$built" -eq 0 ]; then
            echo "::error::No election has snapshots to report on."
            exit 1
          fi

      - name: Check generated patch formatting
        run: git diff --check

      - name: Upload report evidence
        uses: actions/upload-artifact@v4
        with:
          name: election-result-reports
          path: election/reports/
          if-no-files-found: error

      - name: Detect report changes
        id: report_diff
        shell: bash
        run: |
          git add -A -- election/reports
          if git diff --cached --quiet -- election/reports; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Reports are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- election/reports
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::Committed reports differ from regenerated reports. Nothing is committed from pull requests; the regenerated reports are in the election-result-reports artifact and will arrive through an automation pull request after merge."
            fi
          fi

  publish-pull-request:
    needs: analyze
    if: >-
      needs.analyze.outputs.reports_changed == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.commit_reports))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out analyzed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replace reports with regenerated evidence
        run: rm -rf election/reports

      - name: Download regenerated reports
        uses: actions/download-artifact@v4
        with:
          name: election-result-reports
          path: election/reports

      - name: Publish verified commit and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: election
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python -m election_reporting.ci.publish_reports
          --base "$BASE_BRANCH"
          --base-sha "$GITHUB_SHA"
          --branch automation/election-reports
          --path election/reports
          --run-url "$RUN_URL"
