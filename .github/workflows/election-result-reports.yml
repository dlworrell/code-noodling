name: Election Result Reports

# ADR-0006 (AES-DEV-001-R003/R005): this workflow never pushes to the default
# branch. When regenerated reports differ from what is committed, the
# publish-pull-request job writes a GitHub-verified commit (GraphQL
# createCommitOnBranch) to the workflow-owned automation/election-reports branch
# and opens or updates a pull request into dev-daily (Catylist ADR-0013:
# automation -> dev-daily -> fitment -> main). It publishes only from a run on
# dev-daily: a push to dev-daily, or a manual workflow_dispatch on dev-daily
# with commit_reports set. Either way, reports are generated from, and proposed
# to, the same dev-daily commit.
# Never add pull_request_target: the publish job holds a write token.
#
# Logic lives in election-analysis/ci/reports.sh (governed scope, Catylist
# ADR-0004); this file picks triggers, permissions and artifacts.

on:
  workflow_dispatch:
    inputs:
      commit_reports:
        description: Open or update a pull request with regenerated reports (dev-daily only)
        required: true
        type: boolean
        default: true
  push:
    # The publisher builds commits on short-lived *-staging branches before
    # moving the automation branch; those pushes need no run of their own.
    branches-ignore:
      - "automation/*-staging"
    paths:
      # Generated reports are excluded so the automation commit does not
      # retrigger this workflow.
      - "election-analysis/**"
      - "!election-analysis/reports/**"
      - ".github/workflows/election-result-reports.yml"
  pull_request:
    paths:
      - "election-analysis/**"
      - ".github/workflows/election-result-reports.yml"
      - ".github/workflows/election-source-watch.yml"

permissions:
  contents: read

concurrency:
  group: election-result-reports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      reports_changed: ${{ steps.report_diff.outputs.changed }}
    steps:
      - name: Check out Code Noodling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned EDT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dlworrell/engineering-docs-toolkit
          ref: bca66c1e2d2a9bf9c05f9429e618299216a17f27
          path: .tools/engineering-docs-toolkit
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test election reporting
        run: election-analysis/ci/reports.sh test 'test_election_reporting.py'

      - name: Test report publisher
        run: election-analysis/ci/reports.sh test 'test_publish_reports.py'

      - name: Test election source watcher
        run: election-analysis/ci/reports.sh test 'test_election_watch*.py'

      - name: Test Alaska precinct crosswalk
        run: election-analysis/ci/reports.sh test 'test_alaska_crosswalk.py'

      - name: Test county and precinct breakdowns
        run: election-analysis/ci/reports.sh test 'test_election_areas.py'

      - name: Generate and validate EDT reports
        run: election-analysis/ci/reports.sh generate

      - name: Check generated patch formatting
        run: git diff --check

      - name: Upload report evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: election-result-reports
          path: election-analysis/reports/
          if-no-files-found: error

      - name: Detect report changes
        id: report_diff
        run: election-analysis/ci/reports.sh detect

  publish-pull-request:
    needs: analyze
    if: >-
      needs.analyze.outputs.reports_changed == 'true' &&
      github.ref == 'refs/heads/dev-daily' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.commit_reports))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # The catylist-ring-0 key is a secret of the RING0 environment (owner set-up,
    # 2026-11-03); naming the environment is what makes it readable here.
    environment: RING0
    steps:
      - name: Check out analyzed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Replace reports with regenerated evidence
        run: election-analysis/ci/reports.sh clear

      - name: Download regenerated reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: election-result-reports
          path: election-analysis/reports

      # Catylist ADR-0012: automation commits and pull requests are made as the
      # catylist-ring-0 App, not the GitHub Actions bot, because GitHub does not
      # run workflows on events created with the workflow's own GITHUB_TOKEN, so
      # required checks never appeared on bot-authored automation PRs (#91).
      # The key is a repository secret added by the owner; without it the step
      # is skipped and publishing falls back to github.token, as before.
      - name: Check for the catylist-ring-0 key
        id: ring0_key
        env:
          KEY: ${{ secrets.RING0_APP_PRIVATE_KEY || secrets.RING0_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::No catylist-ring-0 key in the RING0 environment; publishing as github-actions, whose PRs get no CI."; fi

      - name: Create catylist-ring-0 token
        id: ring0
        if: ${{ steps.ring0_key.outputs.present == 'true' }}
        # A bad or rotated key must never stop publication: on failure the
        # publish step falls back to github.token (no CI on that PR, as before).
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RING0_APP_ID || '5474337' }}
          private-key: ${{ secrets.RING0_APP_PRIVATE_KEY || secrets.RING0_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Warn when publishing without ring-0
        if: ${{ steps.ring0_key.outputs.present == 'true' && steps.ring0.outcome != 'success' }}
        run: echo "::warning::The catylist-ring-0 token could not be created (check RING0_PRIVATE_KEY in the RING0 environment); publishing as github-actions, whose PRs get no CI."

      - name: Publish verified commit and pull request
        env:
          GH_TOKEN: ${{ steps.ring0.outputs.token || github.token }}
          BASE_BRANCH: dev-daily
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: election-analysis/ci/reports.sh publish
