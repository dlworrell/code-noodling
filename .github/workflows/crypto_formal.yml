name: Montgomery Scoped Formal Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-lemmas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Logic lives in the crypto_pipeline scope (Catylist ADR-0004).
      - name: Install pinned proof tools
        run: crypto_pipeline/ci/formal.sh install-tools
      - name: Check proof-script syntax
        run: crypto_pipeline/ci/formal.sh syntax
      - name: Source checks, arithmetic lemmas, and deliberate counterexamples
        run: crypto_pipeline/ci/formal.sh proofs
      - name: Carry extractor and solver-evidence rejection tests
        run: crypto_pipeline/ci/formal.sh carry-tests
      - name: Retain proof inputs and results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: montgomery-formal-16
          path: build/formal/
          if-no-files-found: error
