name: Montgomery Scoped Formal Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-lemmas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned proof tools
        run: |
          python -m pip install -r crypto_pipeline/proof/requirements.txt
          bash crypto_pipeline/proof/install_cbmc.sh .tools/cbmc
      - name: Check proof-script syntax
        run: python -m compileall -q crypto_pipeline/proof
      - name: Source checks, arithmetic lemmas, and deliberate counterexamples
        run: python crypto_pipeline/proof/run_proofs.py --cbmc .tools/cbmc/usr/bin/cbmc --output build/formal
      - name: Carry extractor and solver-evidence rejection tests
        run: python -m unittest discover -s crypto_pipeline/proof -p test_carry_driver.py
      - name: Retain proof inputs and results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: montgomery-formal-16
          path: build/formal/
          if-no-files-found: error
