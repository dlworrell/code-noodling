name: Cryptographic Wrapper Validation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto_pipeline

    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v4

    - name: Install Defensive Auditing Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang clang-tidy valgrind libssl-dev

    - name: Step 1 - Static Analysis (Clang-Tidy)
      run: |
        clang-tidy crypto_multiplier.c crypto_montgomery_ct.c test_montgomery_ct.c test_suite.c test_bounds.c -- -std=c11

    - name: Step 2 - Compile Binary Targets via Makefile
      run: |
        make clean
        make shared
        make all

    - name: Step 3 - Execution Verification & Memory Leak Audit
      run: |
        # Run test executable inside Valgrind's Memcheck engine
        valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./test_suite

    - name: Step 4 - Functional Smoke Test
      run: |
        # This smoke test does not establish constant-time or side-channel safety.
        ./test_suite
        echo "[CI Pipeline Pass] Build and functional smoke tests completed."

    - name: Boundary tests with AddressSanitizer and UndefinedBehaviorSanitizer
      run: make bounds-sanitize

    - name: Differential arithmetic tests against Python integers
      run: |
        python3 test_arithmetic.py
        python3 test_montgomery_ct.py
