name: Election Source Watch

# Checks the official result sources selected in election-analysis/data/watch.toml and
# proposes new snapshots as a pull request (election-analysis/docs/engineering/ADR-002).
#
# Runs hourly at :07. Owner decision (2026-11-03): primary and backup hourly,
# on opposite sides of the hour. The backup is an external scheduler, outside
# this repository, that dispatches this workflow with force=false; the
# intended backup minute is :37, and its actual configuration is not recorded
# or guaranteed here. `python -m election_reporting.watch fetch` decides whether
# each state is due (every 30 minutes from polls closing until 02:00, then
# hourly until certification) and exits quickly otherwise, so a state's
# half-hour slot is only collected when a run (primary or backup) lands in it.
#
# ADR-0006 (AES-DEV-001-R003/R005): this workflow never pushes to the default
# branch. New snapshots go to the workflow-owned automation/election-sources
# branch as a GitHub-verified commit (GraphQL createCommitOnBranch), with a
# pull request into dev-daily (Catylist ADR-0013: automation -> dev-daily ->
# fitment -> main). Schedules run on the default branch, so the job checks out
# dev-daily and proposes snapshots against that exact commit. Snapshots waiting in that pull request
# are carried forward into each run, because report files the state overwrites
# cannot be downloaded again.
# Never add pull_request_target: this job holds a write token.
#
# Logic lives in election-analysis/ci/watch.sh (governed scope, Catylist
# ADR-0004); this file picks triggers, permissions and checkouts.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Fetch now, even outside the checking window
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: election-source-watch
  cancel-in-progress: false

env:
  SNAPSHOT_BRANCH: automation/election-sources

jobs:
  watch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The catylist-ring-0 key is a secret of the RING0 environment (owner set-up,
    # 2026-11-03); naming the environment is what makes it readable here.
    environment: RING0
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out dev-daily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev-daily
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test watcher (offline)
        run: election-analysis/ci/watch.sh test

      - name: Find unmerged snapshots
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: election-analysis/ci/watch.sh pending

      - name: Check out unmerged snapshots
        if: steps.pending.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_BRANCH }}
          path: .pending
          persist-credentials: false

      - name: Carry forward unmerged snapshots
        if: steps.pending.outputs.exists == 'true'
        run: election-analysis/ci/watch.sh carry .pending

      - name: Fetch new snapshots
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          ORIGINALS_DIR: ${{ runner.temp }}/election-originals
        run: election-analysis/ci/watch.sh fetch

      # Owner retention rule (2026-11-03): every downloaded file is saved
      # unmodified, retained for 30 days and archived. The bodies, headers and
      # MANIFEST.json (election_reporting/watch/originals.py) are kept as this
      # run's artifact for 90 days, a fallback copy; the archive step below
      # uploads them to Dropbox in this same run. Runs even when a fetch
      # failed, so partial downloads are kept.
      - name: Keep downloaded originals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: election-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/election-originals/
          if-no-files-found: ignore
          retention-days: 90

      # Catylist ADR-0012: automation commits and pull requests are made as the
      # catylist-ring-0 App, not the GitHub Actions bot, because GitHub does not
      # run workflows on events created with the workflow's own GITHUB_TOKEN, so
      # required checks never appeared on bot-authored automation PRs (#91).
      # The key is a repository secret added by the owner; without it the step
      # is skipped and publishing falls back to github.token, as before.
      - name: Check for the catylist-ring-0 key
        id: ring0_key
        env:
          KEY: ${{ secrets.RING0_APP_PRIVATE_KEY || secrets.RING0_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::warning::No catylist-ring-0 key in the RING0 environment; publishing as github-actions, whose PRs get no CI."; fi

      - name: Create catylist-ring-0 token
        id: ring0
        if: ${{ steps.ring0_key.outputs.present == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RING0_APP_ID || '5474337' }}
          private-key: ${{ secrets.RING0_APP_PRIVATE_KEY || secrets.RING0_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish verified commit and pull request
        # Runs even when one state's fetch failed, so the other states'
        # snapshots are still proposed.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.ring0.outputs.token || github.token }}
          BASE_BRANCH: dev-daily
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: election-analysis/ci/watch.sh publish

      # Owner decision (2026-11-03): archive the downloaded originals to
      # Dropbox /Apps/election-analyser/data/<state>/ (app-folder access only) (body, header and
      # SHA-256 stamp per file; election_reporting/watch/dropbox_archive.py).
      # Runs after publication so an archive failure never blocks snapshots.
      # Needs the DROPBOX_APP_KEY, DROPBOX_APP_SECRET and DROPBOX_REFRESH_TOKEN
      # secrets; without them it warns and the 90-day artifact remains.
      - name: Archive originals to Dropbox
        if: ${{ !cancelled() }}
        env:
          ORIGINALS_DIR: ${{ runner.temp }}/election-originals
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: election-analysis/ci/watch.sh archive
