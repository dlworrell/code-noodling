# Generated by `python -m election_reporting.watch plan` from
# election/data/watch.toml. Safe to edit: later runs only append sources
# for newly selected places.
schema_version = 1

[election]
title = "2026 General Election (November 3, 2026)"

[analysis]
write_in_labels = ["write-in", "write in"]
# Maine: plurality, except contests posted as ranked choice, which the
# watcher adds below as [[contest_rules]] with rule "rcv".
default_rule = "winner"

[[sources]]
id = "maine"
path = "input/maine"
jurisdiction = "Maine State"
scope = "state"
priority = 100
# certification_date: not published; add it when known
# expected_final_ballots = 0       # add a turnout forecast to enable
# forecast_reliability = 50        # remaining-ballot estimates
# forecast_basis = "..."

